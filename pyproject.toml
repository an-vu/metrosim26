[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["metrosim26", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["*.py", "metrosim26", "scripts", "tests"]
exclude = ["**/__pycache__", ".venv", "venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
